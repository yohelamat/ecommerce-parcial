steps:
  # Build de la imagen
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/api-ecommerce', '.']
  
  # Subir a Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/api-ecommerce']
  
  # Despliegue en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'api-ecommerce'
      - '--image'
      - 'gcr.io/$PROJECT_ID/api-ecommerce'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'