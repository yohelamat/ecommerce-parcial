steps:
# 1. Construir la imagen de Docker
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/api-ecommerce', '.']

# 2. Subir la imagen al registro de Google
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/api-ecommerce']

# 3. Desplegar la nueva imagen en Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'api-ecommerce'
  - '--image'
  - 'gcr.io/$PROJECT_ID/api-ecommerce'
  - '--region'
  - 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY